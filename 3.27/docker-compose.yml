version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    cap_drop:
      - ALL
    depends_on:
      - gocalc
    networks:
      - frontend-net

  gocalc:
    # ИСПРАВЛЕНО: Собираем из Dockerfile в текущей папке
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - frontend-net
      - backend-net
    # Убедитесь, что gocalc использует 'postgres' как имя хоста для БД
    environment:
      - DB_HOST=postgres
      - DB_USER=user         # Замените на ваше
      - DB_PASSWORD=password   # Замените на ваше
      - DB_NAME=gocalc_db    # Замените на ваше

  postgres:
    image: postgres:14-alpine
    networks:
      - backend-net
    environment:
      # Убедитесь, что эти значения СОВПАДАЮТ с теми, что у gocalc
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gocalc_db
    # Опционально: для сохранения данных postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

# ЭТОТ БЛОК (networks) ДОЛЖЕН БЫТЬ НА ТОМ ЖЕ УРОВНЕ, ЧТО И 'services'
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

# ЭТОТ БЛОК (volumes) ДОЛЖЕН БЫТЬ НА ТОМ ЖЕ УРОВНЕ, ЧТО И 'services'
volumes:
  postgres-data: