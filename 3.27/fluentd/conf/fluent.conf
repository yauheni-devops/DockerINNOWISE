# Этот <source> блок принимает логи от других контейнеров
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Этот <match> блок отправляет логи в Elasticsearch И в консоль fluentd
<match *.**>
  @type copy

  # Блок для Elasticsearch
  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    logstash_format true
    # Используем первую часть тега (например, 'web' из 'web.service') как имя индекса
    index_name ${tag_parts[0]}
    # Формат индекса будет, например, web-2025.11.06
    logstash_prefix ${tag_parts[0]}
    logstash_dateformat %Y.%m.%d
    include_tag_key true
    tag_key @log_name
    flush_interval 10s
  </store>

  # (Опционально) Блок для вывода логов в stdout контейнера fluentd
  # Это очень полезно для отладки
  <store>
    @type stdout
  </store>
</match>